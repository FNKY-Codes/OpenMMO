id: 1
name: First Steps in the Reach
description: Learn the paths of survival and prove you can endure Verdant Reach.
stages:
  - stage: 1
    description: Speak with the guide at spawn.
    objective:
      type: talk_to_npc
      npc_id: 1
  - stage: 2
    description: Scavenge timber from a ruined birch node.
    objective:
      type: harvest
      tag: timber
      count: 1
  - stage: 3
    description: Fabricate timber into a plank.
    objective:
      type: refine
      recipe_id: timber_to_plank
      count: 1
  - stage: 4
    description: Defeat a Meadow Crawler in combat.
    objective:
      type: kill_npc
      npc_id: 1
      count: 1
  - stage: 5
    description: Reach Scavenging level 5.
    objective:
      type: reach_skill_level
      skill: scavenging
      level: 5
