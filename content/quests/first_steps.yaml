id: 1
name: First Steps in the Reach
description: Learn the paths of survival and prove you can endure Verdant Reach.
stages:
  - stage: 1
    description: Speak with the Wasteland Guide in town.
    objective:
      type: talk_to_npc
      npc_id: 100
  - stage: 2
    description: Cut timber from a birch in the woods west of town.
    objective:
      type: harvest
      tag: timber
      count: 1
  - stage: 3
    description: Saw the timber into a plank at the town workbench.
    objective:
      type: refine
      recipe_id: timber_to_plank
      count: 1
  - stage: 4
    description: Kill a Mutant Rat in the outskirts.
    objective:
      type: kill_npc
      npc_id: 4
      count: 1
  - stage: 5
    description: Reach Scavenging level 5.
    objective:
      type: reach_skill_level
      skill: scavenging
      level: 5
