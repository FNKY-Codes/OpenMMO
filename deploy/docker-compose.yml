services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: openmmo
      POSTGRES_PASSWORD: openmmo
      POSTGRES_DB: openmmo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
