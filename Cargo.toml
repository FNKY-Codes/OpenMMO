[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/protocol",
    "crates/engine",
    "crates/client",
    "crates/server",
    "tools/content-validator",
    "tools/atlas-packer",
]
default-members = ["crates/client", "crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/fnky-codes/openmmo"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
futures-util = "0.3"
sqlx = { version = "0.7", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json"] }
wgpu = "23"
winit = "0.30"
pollster = "0.3"
bytemuck = { version = "1", features = ["derive"] }
egui = "0.30"
egui-wgpu = "0.30"
egui-winit = "0.30"
tokio-tungstenite = "0.23"
url = "2"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
