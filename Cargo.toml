[workspace]
resolver = "2"
members = [
    "crates/sdk",
    "crates/common",
    "crates/protocol",
    "crates/engine",
    "crates/client",
    "crates/server",
    "tools/content-validator",
    "tools/region-linter",
    "tools/asset-manifest",
    "tools/model-importer",
    "tools/atlas-packer",
]
default-members = ["crates/client", "crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/fnky-codes/openmmo"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
futures-util = "0.3"
sqlx = { version = "0.7", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json"] }
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
sha2 = "0.10"
argon2 = { version = "0.5", features = ["std"] }
wgpu = "23"
winit = "0.30"
pollster = "0.3"
bytemuck = { version = "1", features = ["derive"] }
egui = "0.30"
egui-wgpu = "0.30"
egui-winit = "0.30"
tokio-tungstenite = { version = "0.23", features = ["rustls-tls-webpki-roots"] }
# tokio-tungstenite pulls rustls with neither `ring` nor `aws-lc-rs`, so rustls
# cannot pick a crypto provider on its own. We depend on it directly to install
# one explicitly. `ring` over `aws-lc-rs`: no cmake/NASM needed to build on Windows.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
url = "2"
toml = "0.8"
openmmo-sdk = { path = "crates/sdk" }
gltf = "1"
image = "0.25"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
